# Local integration config: roots are relative to the repo root (run from there).
server {
    listen 127.0.0.1:9099;
    root tests/www;
    index index.html;

    # inherits root + index from server; listing disabled
    location / {
        directory_listing off;
    }

    # no index file inside -> listing allowed
    location /open {
        directory_listing on;
    }

    # inherits everything, no directives of its own
    location /pages {
        allowed_methods GET HEAD;
    }
}
