# CASE B — disproves the "directive order breaks inheritance" theory.
#
# client_max_body_size is written AFTER both location blocks. The claim was
# that a location parsed before the directive captures the 1M default instead.
# It does not: inheritance is resolved in a SECOND PASS once the server block
# closes (Config.cpp:367-379), precisely so source order cannot matter.
#
# Parsed:   server 10M, location /big 10M   (tests/dump_config.cpp)
# Enforced: 512 KB -> 403,  2 MB -> 403     <-- 2 MB admitted, so 10M is live
#
# 403, not the 501 written here before, only because 501 was the PostHandler
# stub and the finished handler rejects a POST to a location with no
# upload_directory (PostHandler.cpp:62-63). What this case asserts is "not 413".
#
#   ./webserv config/bodysize-case-b.conf &
#   curl -s -o /dev/null -w "%{http_code}\n" -H "Expect:" \
#        -X POST --data-binary @/tmp/body2m.bin http://127.0.0.1:8092/big
#
# An explicit cap inside a location still wins over the server value regardless
# of order -- covered by the ordering asserts in tests/test_config.cpp.

server {
    listen 8092;
    server_name localhost;
    root ./www;
    index index.html;

    location /big {
        allowed_methods GET POST;
    }

    client_max_body_size 10M;   # after the location, still inherited by it
}
