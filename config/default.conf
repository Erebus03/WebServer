# Webserv demo configuration -- every path here exists in the repo, so a fresh
# clone can run it as-is:  ./webserv config/default.conf  ->  http://127.0.0.1:8080/

# Main HTTP server
server {
    listen 0.0.0.0:8080;
    server_name example.com www.example.com;

    root www;
    index index.html index.htm;

    client_max_body_size 10M;

    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 502 503 /50x.html;

    # Static content - read only
    location / {
        allowed_methods GET HEAD;
        directory_listing off;
    }

    # File uploads
    location /uploads {
        allowed_methods POST;
        upload_directory www/uploads;
        client_max_body_size 50M;
    }

    # CGI scripts
    location /cgi-bin {
		allowed_methods GET HEAD POST;
		cgi_extension .php /usr/bin/php-cgi;
		cgi_extension .py /usr/bin/python3;
    }

    # Redirect old URLs
    location /legacy {
        redirect 301 /;
    }
}

# Development/Testing Server
server {
    listen 127.0.0.1:8000;
    server_name localhost dev.local;

    root www;
    index index.html index.php;

    client_max_body_size 100M;

    error_page 404 /404.html;
    error_page 500 /50x.html;

    # Allow all methods for development
    location / {
        allowed_methods GET HEAD POST PUT DELETE;
        directory_listing on;
    }

    # Development uploads
    location /test-upload {
        allowed_methods POST;
        upload_directory /tmp/dev_uploads;
        client_max_body_size 200M;
    }
}
