# Postman verification config. Every path in here EXISTS -- unlike default.conf.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 10M;

    error_page 404 /404.html;
    error_page 500 502 503 /50x.html;

    location / {
        allowed_methods GET;
        directory_listing on;
    }

    # CGI. NO upload_directory here -- see /uploads below for why.
    location /cgi-bin {
        allowed_methods GET POST;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .php /usr/bin/php-cgi;
    }

    # CGI reached as an INDEX file (the /php/ -> index.php fix).
    location /php {
        allowed_methods GET POST;
        index index.php;
        cgi_extension .php /usr/bin/php-cgi;
    }

    # Uploads. Deliberately NO cgi_extension: an upload_directory served by a
    # location that can execute what lands in it is remote code execution.
    location /uploads {
        allowed_methods GET POST DELETE;
        upload_directory www/uploads;
        directory_listing on;
    }
}
