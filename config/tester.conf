server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 10M;

    location / {
        # HEAD alongside GET: the method gate refuses before routing can run, so
        # without it HEAD is 405 and C's HEAD support never gets reached. The
        # school tester's second test is a HEAD on /.
        allowed_methods GET HEAD;
        cgi_extension .bla /home/er3bus/Webserver/cgi_tester;
    }

    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
        upload_directory ./uploads;
    }

    location /directory {
        # POST is here because the tester's own setup text says "any file with
        # .bla as extension must answer to POST request by calling the cgi_test
        # executable", and every .bla it touches lives under /directory. Our
        # locations match on path prefix, so there is no way to allow POST for
        # one extension and refuse it for the rest of the same prefix.
        allowed_methods GET HEAD POST;
        # The tester POSTs a 100000000-byte body to /directory/youpi.bla. The
        # server block's 10M would reject it, so this overrides upward — which
        # only works because _enforceReadLimits now resolves the LOCATION's cap
        # (see config/bodysize-case-a.conf for the case that pins that).
        client_max_body_size 200M;
        # alias, not root: the tester asks for /directory/youpi.bla and the file
        # is ./YoupiBanane/youpi.bla. Under `root` this would resolve to
        # ./YoupiBanane/directory/youpi.bla, which is why other implementations
        # need a `directory -> YoupiBanane` symlink and we do not.
        alias ./YoupiBanane;
        index youpi.bad_extension;
        cgi_extension .bla /home/er3bus/Webserver/cgi_tester;
    }
}
