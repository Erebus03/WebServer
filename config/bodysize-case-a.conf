# CASE A — a location's client_max_body_size is enforced. FIXED; kept as a
# regression test. Read with case C, which is the control.
#
# Server says 1M, location /big says 10M. The parser stored 10M on the location
# all along (verify with tests/dump_config.cpp), but _enforceReadLimits read
# server_cfg->client_max_body_size and nothing else, so loc.client_max_body_size
# was read nowhere outside Config.cpp and a 2 MB body got 413 under a 10M
# location. It now resolves the location through the same Router::match() the
# Dispatcher uses.
#
#   ./webserv config/bodysize-case-a.conf &
#   head -c $((2*1024*1024)) /dev/zero > /tmp/body2m.bin
#   curl -s -o /dev/null -w "%{http_code}\n" -H "Expect:" \
#        -X POST --data-binary @/tmp/body2m.bin http://127.0.0.1:8091/big
#
#   BEFORE:  512 KB -> 501   2 MB -> 413   <-- location's 10M ignored
#   NOW:     512 KB -> 403   2 MB -> 403   <-- both admitted; 10M is live
#
# The code moved from 501 to 403 for an unrelated reason: 501 was the
# PostHandler stub, and the finished handler answers 403 because this server
# block declares no upload_directory (PostHandler.cpp:62-63). Neither number is
# the point -- "not 413" is. Case C, identical minus the override, still 413s
# the 2 MB body, and that difference is the whole proof.
#
# Pass -H "Expect:" or curl adds a flat ~1s wait for a 100 Continue we never
# send.

server {
    listen 8091;
    server_name localhost;
    root ./www;
    index index.html;

    client_max_body_size 1M;

    location /big {
        allowed_methods GET HEAD POST;
        client_max_body_size 10M;   # parsed and stored, but never consulted
    }
}
