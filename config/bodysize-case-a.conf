# CASE A — the real bug: a location's client_max_body_size is never enforced.
#
# Server says 1M, location /big says 10M. The parser stores 10M on the location
# (verify with tests/dump_config.cpp). The running server still rejects a 2 MB
# body with 413 -- the SERVER's 1M wins, because _enforceReadLimits
# (Server.cpp:490) reads server_cfg->client_max_body_size and nothing else.
# loc.client_max_body_size is read nowhere outside Config.cpp.
#
#   ./webserv config/bodysize-case-a.conf &
#   head -c $((2*1024*1024)) /dev/urandom > /tmp/body2m.bin
#   curl -s -o /dev/null -w "%{http_code}\n" -H "Expect:" \
#        -X POST --data-binary @/tmp/body2m.bin http://127.0.0.1:8091/big
#
#   512 KB -> 501   (accepted; 501 is the PostHandler stub, not an error here)
#   2 MB   -> 413   <-- location's 10M ignored
#
# Pass -H "Expect:" or curl adds a flat ~1s wait for a 100 Continue we never
# send. Compare against bodysize-case-c.conf, which is the same minus the
# location override and behaves identically -- that is the point.

server {
    listen 8091;
    server_name localhost;
    root ./www;
    index index.html;

    client_max_body_size 1M;

    location /big {
        allowed_methods GET POST;
        client_max_body_size 10M;   # parsed and stored, but never consulted
    }
}
