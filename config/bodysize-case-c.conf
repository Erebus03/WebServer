# CASE C — the control. Same as case A but with NO location override.
#
# Exists so case A's 413 cannot be blamed on something unrelated. If A and C
# behave identically, the 10M written on A's location is provably doing nothing.
#
# Enforced: 512 KB -> 501,  2 MB -> 413   (identical to case A)
#
#   ./webserv config/bodysize-case-c.conf &
#   curl -s -o /dev/null -w "%{http_code}\n" -H "Expect:" \
#        -X POST --data-binary @/tmp/body2m.bin http://127.0.0.1:8093/big

server {
    listen 8093;
    server_name localhost;
    root ./www;
    index index.html;

    client_max_body_size 1M;

    location /big {
        allowed_methods GET POST;
    }
}
