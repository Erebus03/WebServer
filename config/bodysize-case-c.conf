# CASE C — the control. Same as case A but with NO location override.
#
# Exists so case A's result cannot be blamed on something unrelated. While the
# override was ignored, A and C behaved identically, which is what proved the
# 10M written on A's location was doing nothing. They now DIVERGE at 2 MB, and
# that divergence is the fix.
#
# Enforced: 512 KB -> 403,  2 MB -> 413   (A now admits the 2 MB; this still
#                                          rejects it, on the server's 1M)
#
#   ./webserv config/bodysize-case-c.conf &
#   curl -s -o /dev/null -w "%{http_code}\n" -H "Expect:" \
#        -X POST --data-binary @/tmp/body2m.bin http://127.0.0.1:8093/big

server {
    listen 8093;
    server_name localhost;
    root ./www;
    index index.html;

    client_max_body_size 1M;

    location /big {
        allowed_methods GET POST;
    }
}
