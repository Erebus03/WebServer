# webserv test console. Every path in here EXISTS -- unlike default.conf.
#   ./webserv config/webapp.conf     then open http://127.0.0.1:8080/
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root ./www;
    index index.html;

    client_max_body_size 20M;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # The console itself, plus every static asset under www/.
    location / {
        allowed_methods GET HEAD;
        directory_listing off;
    }

    # Uploads live here and are served straight back from here.
    #
    # DELIBERATELY NO cgi_extension ON THIS LOCATION. An upload_directory that
    # the same location can also execute is remote code execution: a multipart
    # POST names its own file ("shell.php") in the request BODY, so the URL
    # carries no .php and the CGI branch never intercepts the upload -- then the
    # next GET runs it. MEASURED, that is a live shell. Keep uploads and
    # cgi_extension on separate locations, always.
    location /uploads {
        allowed_methods GET HEAD POST DELETE;
        upload_directory www/uploads;
        directory_listing on;
        client_max_body_size 20M;
    }

    # CGI. Server.cpp chdir()s into the script's own directory before execve,
    # so a script reading the upload dir refers to it as ../uploads.
    location /cgi-bin {
        allowed_methods GET HEAD POST;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .php /usr/bin/php-cgi;
    }

    # CGI reached as an index file: GET /php/ runs index.php.
    location /php {
        allowed_methods GET HEAD POST;
        index index.php;
        cgi_extension .php /usr/bin/php-cgi;
    }

    # HTTP redirection: 301 + Location, no filesystem access at all.
    # Dispatcher.cpp:18 answers from redirect_url before methods or handlers.
    location /old {
        redirect 301 /;
    }
}
