# Demo config for the correction sheet's "Check with a browser" section.
# Everything that section asks you to try is reachable from the home page:
#
#   http://127.0.0.1:8080/           the static site      (headers, Content-Type)
#   http://127.0.0.1:8080/about.html a second page
#   http://127.0.0.1:8080/nope.html  a wrong URL          -> custom 404
#   http://127.0.0.1:8080/listing/   a directory listing
#   http://127.0.0.1:8080/old        a redirected URL     -> 301 to /
#
# The subject requires demo configs: "You must provide configuration files and
# default files to test and demonstrate that every feature works during the
# evaluation."

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root www;
    index index.html;
    client_max_body_size 1M;

    error_page 404 /404.html;
    error_page 500 /50x.html;

    location / {
        allowed_methods GET;
        directory_listing off;
    }

    # A directory listing only appears when the directory has NO index file --
    # `index` wins over `directory_listing`, which is why this points at
    # YoupiBanane (no index.html) and not at www/ (which has one).
    location /listing {
        allowed_methods GET;
        alias YoupiBanane;
        directory_listing on;
    }

    location /old {
        redirect 301 /;
    }
}
