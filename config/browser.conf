# Demo config for the correction sheet's "Check with a browser" section.
# Everything that section asks you to try is reachable from the home page:
#
#   http://127.0.0.1:8080/                 the static site      (headers, Content-Type)
#   http://127.0.0.1:8080/about.html       a second page
#   http://127.0.0.1:8080/nope.html        a wrong URL          -> custom 404
#   http://127.0.0.1:8080/listing/         a directory listing
#   http://127.0.0.1:8080/old              a redirected URL     -> 301 to /
#   http://127.0.0.1:8080/cgi-bin/cookies.py  cookie demo #1: fixed session id
#   http://127.0.0.1:8080/cgi-bin/visits.py   cookie demo #2: a counter that climbs
#   http://127.0.0.1:8080/lab.html            test lab: upload, delete, cookies, errors
#
# The subject requires demo configs: "You must provide configuration files and
# default files to test and demonstrate that every feature works during the
# evaluation."

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root www;
    index index.html;
    client_max_body_size 1M;

    error_page 404 /404.html;
    error_page 500 /50x.html;

    location / {
        allowed_methods GET;
        directory_listing off;
    }

    # A directory listing only appears when the directory has NO index file --
    # `index` wins over `directory_listing`, which is why this points at
    # YoupiBanane (no index.html) and not at www/ (which has one).
    location /listing {
        allowed_methods GET;
        alias YoupiBanane;
        directory_listing on;
    }

    location /old {
        redirect 301 /;
    }

    # Cookie/session demo: mints a session_id on first hit (Set-Cookie),
    # recognizes it on reload. See www/cgi-bin/cookies.py.
    location /cgi-bin {
        allowed_methods GET;
        cgi_extension .py /usr/bin/python3;
    }

    # Upload/delete round trip for lab.html. `alias uploads` (not `root`) so
    # DELETE resolves to the SAME directory POST wrote to -- PostHandler uses
    # upload_directory, DeleteHandler uses root/alias, and they must agree.
    # directory_listing on: lets you SEE what's actually on disk after a POST.
    location /uploads {
        allowed_methods GET POST DELETE;
        upload_directory uploads;
        alias uploads;
        directory_listing on;
        client_max_body_size 5M;
    }
}
